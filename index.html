<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="에스쁘아, espoir, 에스쁘아 리디자인, 화장품 브랜드, 뷰티 브랜드, 코스메틱, UIUX 디자인, 웹디자인, 웹사이트 리디자인, 포트폴리오">

    <title>에스쁘아 | 리디자인</title>
    <link rel="shortcut icon" href="https://www.espoir.com/resources/images/favicon-16x16.png" type="image/x-icon">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/index.css">
    <!-- 웹폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bitter:ital,wght@0,100..900;1,100..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Jua&family=Noto+Sans+KR:wght@100..900&family=Playball&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bitter:ital,wght@0,100..900;1,100..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Jua&family=Noto+Sans+KR:wght@100..900&family=Playball&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="./script/index.js" defer></script>
</head>
<body>
    <header>
        <div class="top_banner">
            <p>나에게 딱 맞는 올리브 톤의 균형으로 더욱 자연스럽고 맑은 피부 표현을 경험해보세요. 시간이 지나도 무너지지 않는 깨끗한 커버와 은은한 광채를 선사합니다.</p>
            <button type="button" class="close"><img src="./image/close.svg" alt="닫기"></button>
        </div>
        <nav>
            <ul class="menu">
                <li><a href="#">BRAND</a></li>
                <li><a href="#">EDIT</a></li>
                <li><a href="#">MAKEUP</a></li>
                <li><a href="#">COMMUNITY</a></li>
            </ul>
            <h1><img src="./image/logo.png" alt="에스쁘아 로고"></h1>
            <ul class="search_login">
                <li><a href="#"><img src="./image/search.svg" alt="찾기"></a></li>
                <li><a href="#"><img src="./image/login.svg" alt="로그인"></a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="bg">
                <div class="pic">
                    <ul class="left">
                        <li><img src="./image/hero_1.png" alt=""></li>
                        <li><img src="./image/hero_2.png" alt=""></li>
                    </ul>
                    <ul class="right">
                        <li><img src="./image/hero_3.png" alt=""></li>
                        <li><img src="./image/hero_4.png" alt=""></li>
                    </ul>
                </div>
                <p class="person"><img src="./image/hero_main.png" alt="윈터사진"></p>
                <div class="slogan">
                    <h2>Roselight glow Collection</h2>
                    <p>Espoir unveils A Rose univers timeless elegance<br>with lively radiance.</p>
                </div>
            </div>
        </section>
    </main>

</html>
